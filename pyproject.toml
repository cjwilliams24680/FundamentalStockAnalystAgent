[project]
name = "fundamentalstockanalystagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "pick>=2.6.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
analyze = "stock_analyst.main:run"
build-directory = "stock_analyst.build_directory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Required because the project name doesn't match the package name.
packages = ["src/stock_analyst"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely-bug patterns)
    "SIM", # flake8-simplify
    "RUF", # ruff-native rules
]

[tool.ruff.lint.per-file-ignores]
# Imports mid-notebook are normal in exploratory cells.
"*.ipynb" = ["E402"]
